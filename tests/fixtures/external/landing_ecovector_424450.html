<meta name="abstract" xml:lang="en" lang="en" content=" Hemorrhage into the large omentum is a general term for a pathological condition in which an omental artery and/or vein ruptures with bleeding into the abdominal cavity and/or forming an omental hematoma. There is a high probability of its diagnosis only during surgery. This is an extremely rare condition, which is described only in clinical case reports. There are primary and secondary omental hemorrhage. Secondary hemorrhage occurs due to various reasons, primary (idiopathic) — in the absence of morphological changes that could lead to bleeding to the large omentum. The article is devoted to a rare case of idiopathic omentum bleeding complicated by hemoperitoneum, diagnosed intraoperatively. The article presents the results of a literary review of the last twenty years on English-language and Russian-language publications on omental hemorrhage, presented in the databases of PubMed and the Russian scientific electronic library (eLIBRARY.RU). According to the results of the analysis of the literature data, ultrasound can be used as a first-line imaging method to assess the presence of hemoperitoneum. But CT angiography is the method of choice in assessing acute intra-abdominal bleeding and determining the cause of bleeding due to its speed, availability and ability to diagnose alternative causes of abdominal pain, and it is also recommended to be performed in cases where ultrasound data do not allow to unambiguously establish the presence of bleeding or localize its source. Also, taking into account the age characteristics and gender of patients, the presence of bleeding into the omentum may be due to conditions such as cystic lymphangioma and interrupted ectopic pregnancy. Other causes may be vascular pathologies, tumors and anticoagulant therapy. When detecting signs of bleeding into the large omentum, in addition to determining the fact of hemoperitoneum and its volume, the most important tasks are to establish the causes of hemorrhage and differential diagnosis between idiopathic and secondary bleeding. "/>
<meta name="abstract" xml:lang="ru" lang="ru" content=" «Кровоизлияние в большой сальник» — общий термин для обозначения патологического состояния, при котором происходит разрыв артерии и/или вены сальника с кровотечением в брюшную полость и/или формированием гематомы в сальнике. Существует высокая вероятность его диагностики только в ходе оперативного вмешательства. Это состояние встречается крайне редко и описывается только в отчетах о клинических случаях. Различают первичное и вторичное кровоизлияние в сальник. Вторичное кровоизлияние возникает вследствие различных причин, первичное (идиопатическое) возникает при отсутствии морфологических изменений, которые могли бы привести к кровотечению в большой сальник. Представленная статья посвящена редкому случаю идиопатического сальникового кровотечения, осложненного гемоперитонеумом, диагностированного интраоперационно. В статье представлены результаты литературного обзора последних двадцати лет по англоязычным и русскоязычным публикациям, посвященным сальниковому кровотечению, представленным в базах данных PubMed и научной электронной библиотеки России (eLIBRARY.RU). Согласно результатам анализа литературных данных, в качестве метода визуализации первой линии для оценки наличия гемоперитонеума можно использовать ультразвуковое исследование. Но компьютерная томографическая ангиография является методом оценки острого внутрибрюшного кровотечения и установки причины кровотечения из-за ее скорости, доступности и способности диагностировать альтернативные причины боли в животе, а также рекомендуется к выполнению в тех случаях, когда данные ультразвукового исследования не позволяют однозначно установить факт наличия кровотечения либо локализовать его источник. По данным литературы, для оценки наличия гемоперитонеума в качестве метода визуализации первой линии используется ультразвуковое исследование. Компьютерная томографическая ангиография наряду с этим исследованием считается «золотым стандартом» диагностики, устанавливающим не только факт гемоперитонеума, но и его причину. Этот тест очень чувствителен к выявлению свободной жидкости и повреждений паренхиматозных органов. С учетом возрастных особенностей и пола пациентов кровотечение в сальник может быть обусловлено такими состояниями, как кистозная лимфангиома и прервавшаяся эктопическая беременность. Иными причинами могут являться сосудистые патологии, новообразования и прием ангикоагулянтов. При выявлении признаков кровотечения в большой сальник помимо определения факта гемоперитонеума и его объема наиболее важными задачами являются установление причин кровоизлияния и дифференциальная диагностика между идиопатическим и вторичным кровотечением. "/>
